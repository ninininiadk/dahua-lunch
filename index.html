<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>大華國中-'紅黃綠燈菜單'</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg: #F1E3C8;
  --bg-raised: #FBF5E8;
  --chalk: #4A3626;
  --chalk-dim: #8C7259;
  --brand: #93673D;
  --brand-dim: #EAD9BC;
  --green: #6F9E6B;
  --green-dim: #E1EBDC;
  --yellow: #C98A24;
  --yellow-dim: #F5E7C6;
  --red: #BE5B41;
  --red-dim: #F3DCD3;
  --line: rgba(74,54,38,0.16);
  --radius: 18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(255,250,240,0.55), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(147,103,61,0.10), transparent 45%);
  color: var(--chalk);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  display:flex;
  justify-content:center;
  padding: 28px 16px 60px;
}
.mono{ font-family:'DM Mono', monospace; }
#app{ width:100%; max-width: 560px; }
.card{
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 22px;
  position: relative;
  box-shadow: 0 10px 30px rgba(74,54,38,0.08);
}
.eyebrow{
  font-family:'DM Mono', monospace; font-size: 12px; letter-spacing: 0.14em;
  color: var(--brand); text-transform: uppercase; margin: 0 0 6px;
}
h1{ font-weight: 900; font-size: 28px; line-height: 1.25; margin: 0 0 4px; position: relative; display: inline-block; }
h1 .underline{ position:absolute; left:-2px; right:-2px; bottom:-6px; height: 10px; }
h1 .underline svg{ width:100%; height:100%; display:block; }
.sub{ color: var(--chalk-dim); font-size: 14.5px; line-height: 1.6; margin: 10px 0 26px; }
.field-label{ font-family:'DM Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: var(--chalk-dim); margin: 22px 0 10px; }

.pill-row{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{
  border: 1px solid var(--line); background: transparent; color: var(--chalk);
  padding: 10px 16px; border-radius: 999px; font-family: 'Noto Sans TC', sans-serif;
  font-size: 15px; font-weight: 500; cursor: pointer; transition: all .15s ease;
}
.pill:hover{ border-color: var(--brand); }
.pill.active{ background: var(--brand); border-color: var(--brand); color: var(--bg-raised); font-weight: 700; }

.vendor-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
.vendor-card{
  border: 1.5px solid var(--line); background: rgba(74,54,38,0.05); border-radius: 14px;
  padding: 16px 8px; text-align:center; cursor:pointer; transition: all .15s ease;
}
.vendor-card .ic{ font-size: 22px; display:block; margin-bottom:6px; }
.vendor-card .nm{ font-size: 13.5px; font-weight: 600; }
.vendor-card:hover{ border-color: var(--brand); }
.vendor-card.active{ background: var(--brand-dim); border-color: var(--brand); }

.num-grid{ display:grid; grid-template-columns: repeat(6,1fr); gap:8px; }
.num-btn{
  aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: transparent;
  color: var(--chalk); font-family:'DM Mono', monospace; font-size: 15px; cursor: pointer; transition: all .15s ease;
}
.num-btn:hover{ border-color: var(--brand); }
.num-btn.active{ background: var(--brand); border-color: var(--brand); color: var(--bg-raised); font-weight: 700; }

.btn-main{
  width:100%; margin-top: 30px; padding: 15px 20px; border-radius: 14px; border: none;
  background: var(--brand); color: var(--bg-raised); font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700; font-size: 16px; cursor: pointer; transition: transform .12s ease, opacity .15s ease;
}
.btn-main:active{ transform: scale(0.98); }
.btn-main:disabled{ opacity: .35; cursor:not-allowed; }
.btn-ghost{
  width:100%; margin-top: 12px; padding: 13px 20px; border-radius: 14px; border: 1px solid var(--line);
  background: transparent; color: var(--chalk-dim); font-family: 'Noto Sans TC', sans-serif;
  font-weight: 500; font-size: 14.5px; cursor: pointer;
}
.btn-ghost:hover{ border-color: var(--chalk-dim); }
.btn-small{
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(74,54,38,0.06);
  color: var(--chalk); font-family:'Noto Sans TC',sans-serif; font-size: 13px; cursor:pointer; white-space:nowrap;
}
.btn-small:hover{ border-color: var(--brand); }
.btn-small:disabled{ opacity:.5; cursor:default; }

.admin-link{
  display:block; text-align:center; margin-top: 22px; color: var(--chalk-dim); font-size: 12.5px;
  font-family:'DM Mono', monospace; background:none; border:none; cursor:pointer; letter-spacing: 0.05em;
}
.admin-link:hover{ color: var(--chalk); }

.progress-row{ display:flex; justify-content:space-between; align-items:center; font-family:'DM Mono', monospace; font-size: 12.5px; color: var(--chalk-dim); margin-bottom: 16px; }
.progress-track{ height:5px; background: rgba(74,54,38,0.10); border-radius:4px; overflow:hidden; margin-bottom:22px; }
.progress-fill{ height:100%; background: var(--brand); transition: width .25s ease; }
.dash-divider{ border: none; border-top: 2px dashed var(--line); margin: 20px 0; }
.dish-row{ margin-bottom: 4px; }
.dish-name{ font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.face-row{ display:flex; gap: 10px; }
.face-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding: 12px 6px 10px;
  border-radius: 14px; border: 1.5px solid var(--line); background: rgba(74,54,38,0.05); cursor: pointer; transition: all .15s ease;
}
.face-btn svg{ width: 34px; height: 34px; }
.face-btn span{ font-size: 12.5px; color: var(--chalk-dim); font-weight:500; }
.face-btn.green.active{ background: var(--green-dim); border-color: var(--green); }
.face-btn.green.active span{ color: var(--green); }
.face-btn.yellow.active{ background: var(--yellow-dim); border-color: var(--yellow); }
.face-btn.yellow.active span{ color: var(--yellow); }
.face-btn.red.active{ background: var(--red-dim); border-color: var(--red); }
.face-btn.red.active span{ color: var(--red); }
.empty-msg{ text-align:center; color: var(--chalk-dim); font-size: 14.5px; padding: 30px 10px; line-height:1.7; }
.thanks-icon{ width:64px; height:64px; margin: 0 auto 18px; display:block; }

.stat-grid{ display:flex; gap:10px; margin-bottom: 24px; }
.stat-box{ flex:1; background: rgba(74,54,38,0.06); border:1px solid var(--line); border-radius:14px; padding: 14px 10px; text-align:center; }
.stat-box .n{ font-family:'DM Mono', monospace; font-size: 24px; font-weight:500; color: var(--chalk); }
.stat-box .l{ font-size: 11.5px; color: var(--chalk-dim); margin-top:4px; }

.dish-stat-block{ margin-bottom: 20px; }
.dish-stat-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.dish-stat-head .name{ font-weight:700; font-size:15.5px; }
.dish-stat-head .meta{ font-family:'DM Mono', monospace; font-size:12px; color: var(--chalk-dim); }
.stack-bar{ display:flex; height: 16px; border-radius: 8px; overflow:hidden; background: rgba(74,54,38,0.10); }
.seg-g{ background: var(--green); } .seg-y{ background: var(--yellow); } .seg-r{ background: var(--red); }
.legend{ display:flex; gap:14px; margin-top:7px; font-family:'DM Mono', monospace; font-size:11.5px; color: var(--chalk-dim); }
.legend .g b{ color: var(--green); } .legend .y b{ color: var(--yellow); } .legend .r b{ color: var(--red); }
.warn-tag{ font-family:'DM Mono', monospace; font-size:11px; color: var(--red); border:1px solid var(--red); border-radius:6px; padding: 1px 6px; margin-left:8px; }

.modal-overlay{ position: fixed; inset:0; background: rgba(43,30,18,0.5); display:flex; align-items:center; justify-content:center; padding: 20px; z-index: 50; }
.modal-box{ background: var(--bg-raised); border:1px solid var(--line); border-radius: var(--radius); padding: 26px 22px; width:100%; max-width: 340px; }
.modal-box input{ width:100%; margin-top:14px; background: rgba(74,54,38,0.06); border:1px solid var(--line); border-radius:10px; color:var(--chalk); padding: 12px 14px; font-family:'DM Mono', monospace; font-size:16px; letter-spacing:0.1em; text-align:center; }
.err-text{ color: var(--red); font-size: 12.5px; margin-top:8px; text-align:center; min-height:16px; }
.top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px; }
.icon-btn{ background:none; border:none; color: var(--chalk-dim); cursor:pointer; font-size: 13px; font-family:'DM Mono',monospace; }
.icon-btn:hover{ color: var(--chalk); }
.loading-txt{ text-align:center; color: var(--chalk-dim); font-size:13.5px; padding: 20px 0; }

.tab-row{ display:flex; gap:6px; margin: 18px 0 20px; background: rgba(74,54,38,0.06); padding:4px; border-radius:12px; }
.tab-btn{ flex:1; border:none; background:transparent; color:var(--chalk-dim); padding:9px 6px; border-radius:9px; font-family:'Noto Sans TC',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; }
.tab-btn.active{ background: var(--brand); color: var(--bg-raised); }

.week-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.week-nav .lbl{ font-family:'DM Mono',monospace; font-size:13px; color:var(--chalk-dim); }
.scan-top{ display:flex; align-items:center; gap:10px; margin-bottom:18px; padding:12px; border:1px dashed var(--line); border-radius:12px; background: rgba(147,103,61,0.08); }
.scan-top .txt{ flex:1; font-size:12.5px; color:var(--chalk-dim); line-height:1.5; }

.day-card{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; background: rgba(74,54,38,0.04); }
.day-card.is-today{ border-color: var(--brand); }
.day-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.day-card-head .dlabel{ font-weight:700; font-size:14.5px; }
.day-card-head .ddate{ font-family:'DM Mono',monospace; font-size:11.5px; color:var(--chalk-dim); }
.day-card textarea{
  width:100%; min-height: 78px; background: rgba(74,54,38,0.05); border:1px solid var(--line); border-radius:10px;
  color:var(--chalk); padding:10px 12px; font-family:'Noto Sans TC',sans-serif; font-size:14px; line-height:1.6; resize:vertical;
}
.day-card textarea::placeholder{ color: var(--chalk-dim); }
.day-card-foot{ display:flex; justify-content:flex-end; margin-top:8px; }

.vendor-name-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.vendor-name-row input{
  flex:1; background: rgba(74,54,38,0.05); border:1px solid var(--line); border-radius:10px; color:var(--chalk);
  padding: 10px 12px; font-family:'Noto Sans TC',sans-serif; font-size:14.5px;
}
.hidden-file{ display:none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// 1. 請將下方網址替換為你在 Firebase Realtime Database 複製的網址（結尾不要加斜線）
const FIREBASE_DB_URL = "https://dahua-lunch-default-rtdb.firebaseio.com";

// 2. 雲端同步儲存層
window.storage = {
  get: async (key) => {
    try {
      const res = await fetch(`${FIREBASE_DB_URL}/${key}.json`);
      const data = await res.json();
      return data !== null ? { value: JSON.stringify(data) } : null;
    } catch (e) {
      console.error("讀取雲端資料失敗:", e);
      return null;
    }
  },
  set: async (key, val) => {
    try {
      await fetch(`${FIREBASE_DB_URL}/${key}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: typeof val === "string" ? val : JSON.stringify(val)
      });
      return true;
    } catch (e) {
      console.error("儲存雲端資料失敗:", e);
      throw e;
    }
  }
};
const ADMIN_PASSCODE = "2580";
const VENDOR_IDS = ['A','B','C'];
const VENDOR_ICONS = { A:'🍱', B:'🍛', C:'🍜' };
const WEEKDAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const WEEKDAY_LABELS = ['一','二','三','四','五','六','日'];

let state = {
  screen: 'home',
  vendor: null,
  grade: null,
  classNum: null,
  ratings: {},
  loading: true,
  adminError: '',
  vendorNames: { A:'昱品', B:'金星', C:'飪珍記' },
  // 需求 1：七八年級預設16班，九年級18班（由雲端或本地動態載入）
  classCounts: { '七': 16, '八': 16, '九': 18 },
  isTester: false, // 需求 2：標記是否為後台測試模式
  menus: { A:{}, B:{}, C:{} },
  surveyData: { responses: [], submissions: [] },
  adminTab: 'stats',
  statsVendor: 'A',
  statsDate: todayStr(),
  menuVendor: 'A',
  weekStart: null,
  weekDraft: {},
  monthStart: null,
  monthDraft: {},
  vendorNameDraft: null,
  scanning: null
};

const ICONS = {
  green: `<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="17" r="1.8" fill="currentColor"/><circle cx="26" cy="17" r="1.8" fill="currentColor"/><path d="M12 24C14 28 26 28 28 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>`,
  yellow: `<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="17" r="1.8" fill="currentColor"/><circle cx="26" cy="17" r="1.8" fill="currentColor"/><path d="M13 25H27" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  red: `<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="17" r="1.8" fill="currentColor"/><circle cx="26" cy="17" r="1.8" fill="currentColor"/><path d="M12 27C14 23 26 23 28 27" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>`
};
const RATING_LABEL = { green: '幾乎吃光', yellow: '剩一些', red: '剩超過一半' };

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div class="card"><p class="loading-txt">載入中...</p></div>`; return; }
  if(state.screen === 'home') return renderHome(app);
  if(state.screen === 'rating') return renderRating(app);
  if(state.screen === 'thanks') return renderThanks(app);
  if(state.screen === 'adminGate') return renderAdminGate(app);
  if(state.screen === 'admin') return renderAdmin(app);
}

function chalkUnderline(color){
  return `<span class="underline"><svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M2 6 C 40 2, 80 9, 120 4 S 180 8, 198 5" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round"/></svg></span>`;
}
function fmtDate(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function getMonday(d){ const date=new Date(d); const day=date.getDay(); const diff=(day===0?-6:1-day); date.setDate(date.getDate()+diff); date.setHours(0,0,0,0); return date; }
function weekDates(monday){ return Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; }); }
function todayStr(){ return fmtDate(new Date()); }
function monthDates(monthStartStr){
  const start = new Date(monthStartStr);
  const y = start.getFullYear(), m = start.getMonth();
  const days = new Date(y, m+1, 0).getDate();
  return Array.from({length:days},(_,i)=> new Date(y, m, i+1));
}
function shiftMonth(monthStartStr, delta){
  const d = new Date(monthStartStr);
  const nd = new Date(d.getFullYear(), d.getMonth()+delta, 1);
  return fmtDate(nd);
}
const WEEKDAY_ZH = ['日','一','二','三','四','五','六'];

// ---------------- HOME ----------------
function renderHome(app){
  const grades = ['七','八','九'];
  // 依當前選擇的年級動態取得班級上限，未選時預設18
  const maxClasses = state.grade ? (state.classCounts[state.grade] || 18) : 18;

  app.innerHTML = `
    <div class="card">
      ${state.isTester ? `
        <div style="background:var(--yellow-dim); border:1px dashed var(--yellow); padding:6px 12px; border-radius:10px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; font-weight:700; color:var(--yellow);">🧪 後台人員測試模式中（可重複填答）</span>
          <button class="btn-small" id="exitTestBtn" style="padding:2px 8px; font-size:11px;">結束測試</button>
        </div>` : ''}

      <p class="eyebrow">午餐滿意度調查</p>
      <h1>大華國中-<span style="position:relative; display:inline-block;">「紅黃綠燈菜單」${chalkUnderline('#93673D')}</span></h1>
      <p class="sub">今天的午餐，你的班級吃得乾淨嗎？花 30 秒幫忙評比一下吧。</p>

      <div class="field-label">選擇今天的供餐廠商</div>
      <div class="vendor-grid" id="vendorGrid">
        ${VENDOR_IDS.map(v => `
          <div class="vendor-card ${state.vendor===v?'active':''}" data-vendor="${v}">
            <span class="ic">${VENDOR_ICONS[v]}</span>
            <span class="nm">${state.vendorNames[v]}</span>
          </div>`).join('')}
      </div>

      <div class="field-label">選擇年級</div>
      <div class="pill-row" id="gradeRow">
        ${grades.map(g => `<button class="pill ${state.grade===g?'active':''}" data-grade="${g}">${g}年級</button>`).join('')}
      </div>

      <div class="field-label">選擇班級</div>
      <div class="num-grid" id="classGrid">
        ${Array.from({length: maxClasses},(_,i)=>i+1).map(n => `<button class="num-btn ${state.classNum===n?'active':''}" data-num="${n}">${n}</button>`).join('')}
      </div>

      <button class="btn-main" id="startBtn" ${(!state.vendor||!state.grade||!state.classNum)?'disabled':''}>開始評比 →</button>
      <button class="admin-link" id="adminEntry">我是調查人員，進入後台</button>
    </div>
  `;

  if(state.isTester){
    document.getElementById('exitTestBtn').onclick = ()=>{ state.isTester = false; render(); };
  }
  document.querySelectorAll('#vendorGrid .vendor-card').forEach(b=>{
    b.onclick = ()=>{ state.vendor = b.dataset.vendor; render(); };
  });
  document.querySelectorAll('#gradeRow .pill').forEach(b=>{
    b.onclick = ()=>{ 
      state.grade = b.dataset.grade;
      // 若原先選的班級超過該年級上限則重設
      if(state.classNum > (state.classCounts[state.grade] || 18)) state.classNum = null;
      render(); 
    };
  });
  document.querySelectorAll('#classGrid .num-btn').forEach(b=>{
    b.onclick = ()=>{ state.classNum = parseInt(b.dataset.num); render(); };
  });
  document.getElementById('startBtn').onclick = ()=>{
    if(!state.vendor || !state.grade || !state.classNum) return;
    state.ratings = {};
    state.screen = 'rating';
    render();
  };
  document.getElementById('adminEntry').onclick = ()=>{
    state.screen = 'adminGate';
    state.adminError = '';
    render();
  };
}

// ---------------- RATING ----------------
function renderRating(app){
  const dishes = (state.menus[state.vendor] && state.menus[state.vendor][todayStr()]) || [];
  const total = dishes.length;
  const done = Object.keys(state.ratings).length;
  const className = `${state.grade}年${state.classNum}班`;
  const vendorName = state.vendorNames[state.vendor];

  if(total === 0){
    app.innerHTML = `
      <div class="card">
        <div class="top-bar">
          <span class="eyebrow mono">${vendorName} · ${className}</span>
          <button class="icon-btn" id="backBtn">← 返回</button>
        </div>
        <div class="empty-msg">調查人員尚未設定「${vendorName}」今天的菜色，<br>請稍後再試，或洽調查人員至後台新增。</div>
        <button class="btn-ghost" id="backBtn2">返回首頁</button>
      </div>
    `;
    document.getElementById('backBtn').onclick = goHome;
    document.getElementById('backBtn2').onclick = goHome;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <div class="top-bar">
        <span class="eyebrow mono">${vendorName} · ${className}</span>
        <button class="icon-btn" id="backBtn">← 返回</button>
      </div>
      <div class="progress-row"><span>評比進度</span><span>${done} / ${total}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${(done/total*100)}%"></div></div>

      ${dishes.map((dish,i)=>`
        ${i>0?'<hr class="dash-divider">':''}
        <div class="dish-row">
          <div class="dish-name">${dish}</div>
          <div class="face-row">
            ${['green','yellow','red'].map(c=>`
              <button class="face-btn ${c} ${state.ratings[dish]===c?'active':''}" data-dish="${dish}" data-color="${c}" style="color:${c==='green'?'var(--green)':c==='yellow'?'var(--yellow)':'var(--red)'}">
                ${ICONS[c]}<span>${RATING_LABEL[c]}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `).join('')}

      <button class="btn-main" id="submitBtn" ${done<total?'disabled':''}>送出評比</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = goHome;
  document.querySelectorAll('.face-btn').forEach(b=>{
    b.onclick = ()=>{ state.ratings[b.dataset.dish] = b.dataset.color; render(); };
  });
  document.getElementById('submitBtn').onclick = submitRatings;
}

function renderStatsTab(body){
  const selectedDate = state.statsDate || todayStr();
  
  // 1. 全校所有班級清單 (七~九年級，各1~18班，共54班)
  const grades = ['七', '八', '九'];
  const allClasses = [];
  grades.forEach(g => {
  const max = state.classCounts[g] || 18;
  for(let i = 1; i <= max; i++){
    allClasses.push(`${g}年${i}班`);
  }
});

  // 2. 篩選所選日期的所有提交紀錄
  const allSubmissionsOnDate = (state.surveyData.submissions || []).filter(s => s.date === selectedDate);
  
  const classStatusMap = {};
  allSubmissionsOnDate.forEach(s => {

  });

  const totalClassesCount = allClasses.length;

  currentVendorResponses.forEach(r => {

  });

  body.innerHTML = `
    <!-- 日期選擇器 -->
    <div style="background:rgba(74,54,38,0.06); padding:12px 14px; border-radius:12px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between;">
      <span style="font-weight:700; font-size:14px;">📅 查看統計日期：</span>
      <input type="date" id="statsDateInput" value="${selectedDate}" style="background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:6px 10px; color:var(--chalk); font-family:'DM Mono',monospace; font-size:14px;">
    </div>

    <!-- 填答進度卡片 -->

        <span class="dlabel">全校班級填答進度（任一廠商）</span>
        <span class="ddate mono" style="font-weight:700; color:var(--brand); font-size:14px;">${submittedCount} / ${totalClassesCount} 班</span>
      </div>
      <p style="font-size:12px; color:var(--chalk-dim); margin:0 0 10px;">綠色為已填答（附廠商名稱），灰色為未填答：</p>
      
      <!-- 各年級填答標籤 -->
      ${grades.map(g => {
        const gradeClasses = allClasses.filter(c => c.startsWith(g));
        return `
          <div style="margin-bottom:8px;">
            <div style="font-size:12.5px; font-weight:700; color:var(--chalk-dim); margin-bottom:4px;">${g}年級</div>
            <div style="display:flex; flex-wrap:wrap; gap:5px;">
              ${gradeClasses.map(cls => {
                const filledVendor = classStatusMap[cls];
                const isFilled = Boolean(filledVendor);
                return `
                  <span style="font-size:11px; font-family:'DM Mono',monospace; padding:3px 6px; border-radius:6px; border:1px solid ${isFilled ? 'var(--green)' : 'var(--line)'}; background:${isFilled ? 'var(--green-dim)' : 'transparent'}; color:${isFilled ? 'var(--chalk)' : 'var(--chalk-dim)'};" title="${isFilled ? `已填答：${filledVendor}` : '未填答'}">
                    ${cls.replace('年','-').replace('班','')} ${isFilled ? `✓` : ''}

                `;

            </div>
          </div>
        `;
      }).join('')}
    </div>

    <hr class="dash-divider">

    <!-- 【功能 2】各班填答紀錄審查區塊 -->
    <div class="field-label" style="margin-top:0;">各班填答審查（防惡意全紅檢視）</div>
    <div style="margin-bottom: 24px;">

        allSubmissionsOnDate.map(sub => {
          // 找出該班各道菜評分
          const classResponses = (state.surveyData.responses || []).filter(r => r.date === selectedDate && r.class === sub.class);
          const isAllRed = classResponses.length > 0 && classResponses.every(r => r.rating === 'red');
          const timeStr = new Date(sub.ts).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
          
          return `

                <div>

    <hr class="dash-divider">

      ${VENDOR_IDS.map(v => `<button class="pill ${state.statsVendor===v?'active':''}" data-v="${v}">${VENDOR_ICONS[v]} ${state.vendorNames[v]}</button>`).join('')}

    <!-- 廠商數據卡片 -->

      <div class="stat-box"><div class="n mono">${currentVendorSubmissions.length}</div><div class="l">該廠商填答班級數</div></div>
      <div class="stat-box"><div class="n mono">${Object.keys(byDish).length}</div><div class="l">當日菜色數</div></div>
    </div>

    <!-- 菜色剩食統計條 -->
    ${Object.keys(byDish).length === 0 ? `<p class="empty-msg">${selectedDate}「${state.vendorNames[state.statsVendor]}」尚無填答紀錄</p>` :
      Object.entries(byDish).map(([dish, c]) => {
        const t = c.green + c.yellow + c.red;
        const redPct = t ? Math.round(c.red / t * 100) : 0;
        return `
          <div class="dish-stat-block">
            <div class="dish-stat-head">
              <span class="name">${dish} ${redPct > 50 ? `<span class="warn-tag">紅色偏多</span>` : ''}</span>
              <span class="meta">共 ${t} 筆評分</span>
            </div>
            <div class="stack-bar">
              ${c.green ? `<div class="seg-g" style="width:${c.green/t*100}%"></div>` : ''}
              ${c.yellow ? `<div class="seg-y" style="width:${c.yellow/t*100}%"></div>` : ''}
              ${c.red ? `<div class="seg-r" style="width:${c.red/t*100}%"></div>` : ''}
            </div>
            <div class="legend">
              <span class="g">綠 <b>${c.green}</b></span>
              <span class="y">黃 <b>${c.yellow}</b></span>
              <span class="r">紅 <b>${c.red}</b>（${redPct}%）</span>
            </div>
          </div>`;
      }).join('')
    }

    <button class="btn-ghost" id="refreshBtn" style="margin-top:20px;">重新整理資料</button>
    <button class="btn-ghost" id="resetBtn" style="color:var(--red); border-color:var(--red-dim);">清空全部填答資料</button>
  `;

  // 事件綁定：切換日期
  body.querySelector('#statsDateInput').onchange = (e) => {
    state.statsDate = e.target.value;
    render();
  };

  // 事件綁定：切換廠商
  body.querySelectorAll('.pill[data-v]').forEach(b => {
    b.onclick = () => { state.statsVendor = b.dataset.v; render(); };
  });

  // 事件綁定：單筆刪除異常資料
  body.querySelectorAll('[data-delsub]').forEach(btn => {
    btn.onclick = async () => {
      const clsName = btn.dataset.delsub;
      if(!confirm(`確定要刪除「${clsName}」在 ${selectedDate} 的這筆填答紀錄嗎？\n刪除後該班將可重新填答。`)) return;
      
      state.surveyData.submissions = (state.surveyData.submissions || []).filter(s => !(s.date === selectedDate && s.class === clsName));
      state.surveyData.responses = (state.surveyData.responses || []).filter(r => !(r.date === selectedDate && r.class === clsName));
      
      try {
        await window.storage.set('survey-data', JSON.stringify(state.surveyData), true);
        alert(`已成功刪除 ${clsName} 的填答資料！`);
      } catch(e) {
        console.error(e);
        alert('刪除失敗，請檢查網路。');
      }
      render();
    };
  });

  // 事件綁定：重新整理
  body.querySelector('#refreshBtn').onclick = async () => {
    state.loading = true; render();
    await loadAllAdminData();
    state.loading = false; render();
  };

  // 事件綁定：清空全部資料
  body.querySelector('#resetBtn').onclick = async () => {
    if(!confirm('確定要清空全部歷史填答資料嗎？此動作無法復原。')) return;
    state.surveyData = { responses: [], submissions: [] };
    try { await window.storage.set('survey-data', JSON.stringify(state.surveyData), true); } catch(e) { console.error(e); }
    render();
  };
}
function loadMonthDraft(){
  const dates = monthDates(state.monthStart);
  const draft = {};
  dates.forEach(d=>{
    const key = fmtDate(d);
    const arr = (state.menus[state.menuVendor] && state.menus[state.menuVendor][key]) || [];
    draft[key] = arr.join('\n');
  });
  state.monthDraft = draft;
}

function renderMenuTab(body){
  const dates = monthDates(state.monthStart);
  const todayS = todayStr();
  const first = new Date(state.monthStart);
  const monthLabel = `${first.getFullYear()} 年 ${first.getMonth()+1} 月`;

  body.innerHTML = `
    <div class="pill-row" style="margin-bottom:18px;" id="menuVendorRow">
      ${VENDOR_IDS.map(v=>`<button class="pill ${state.menuVendor===v?'active':''}" data-v="${v}">${VENDOR_ICONS[v]} ${state.vendorNames[v]}</button>`).join('')}
    </div>

    <div class="week-nav">
      <button class="btn-small" id="prevMonth">← 上個月</button>
      <span class="lbl">${monthLabel}</span>
      <button class="btn-small" id="nextMonth">下個月 →</button>
    </div>

    <div class="scan-top">
      <span style="font-size:20px;">📷</span>
      <span class="txt">上傳一張整月菜單照片（例如日曆式菜單表），AI 會自動依日期把整月的菜色填進下方欄位，填入後仍可手動修改。</span>
      <button class="btn-small" id="scanMonthBtn">${state.scanning==='month'?'辨識中…':'掃描整月'}</button>
      <input type="file" accept="image/*" class="hidden-file" id="monthFileInput">
    </div>

    <div id="dayCards">
      ${dates.map((d)=>{
        const key = fmtDate(d);
        const isToday = key===todayS;
        return `
          <div class="day-card ${isToday?'is-today':''}">
            <div class="day-card-head">
              <span class="dlabel">${d.getMonth()+1}/${d.getDate()}（星期${WEEKDAY_ZH[d.getDay()]}）${isToday?'　今天':''}</span>
              <span class="ddate mono">${key}</span>
            </div>
            <textarea data-date="${key}" placeholder="一行一道菜，例如：&#10;紅燒獅子頭&#10;炒高麗菜&#10;玉米濃湯">${state.monthDraft[key]||''}</textarea>
            <div class="day-card-foot">
              <button class="btn-small" data-scanday="${key}">${state.scanning===key?'辨識中…':'📷 掃描這天菜單'}</button>
              <input type="file" accept="image/*" class="hidden-file" data-dayfile="${key}">
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <button class="btn-main" id="saveMonthBtn">儲存本月菜色</button>
  `;

  body.querySelectorAll('#menuVendorRow .pill').forEach(b=>{
    b.onclick = ()=>{ state.menuVendor = b.dataset.v; loadMonthDraft(); render(); };
  });
  body.querySelector('#prevMonth').onclick = ()=>{
    state.monthStart = shiftMonth(state.monthStart, -1); loadMonthDraft(); render();
  };
  body.querySelector('#nextMonth').onclick = ()=>{
    state.monthStart = shiftMonth(state.monthStart, 1); loadMonthDraft(); render();
  };
  body.querySelectorAll('#dayCards textarea').forEach(t=>{
    t.oninput = ()=>{ state.monthDraft[t.dataset.date] = t.value; };
  });
  body.querySelector('#saveMonthBtn').onclick = async ()=>{
    if(!state.menus[state.menuVendor]) state.menus[state.menuVendor] = {};
    Object.entries(state.monthDraft).forEach(([date, text])=>{
      const list = text.split('\n').map(s=>s.trim()).filter(Boolean);
      if(list.length) state.menus[state.menuVendor][date] = list;
      else delete state.menus[state.menuVendor][date];
    });
    try{
      await window.storage.set('menus', JSON.stringify(state.menus), true);
      alert('本月菜色已儲存！');
    }catch(e){ console.error(e); alert('儲存失敗，請檢查網路連線後再試一次。'); }
    render();
  };

  // per-day scan
  body.querySelectorAll('[data-scanday]').forEach(btn=>{
    const date = btn.dataset.scanday;
    btn.onclick = ()=>{
      const fileInput = body.querySelector(`[data-dayfile="${date}"]`);
      fileInput.value = '';
      fileInput.onchange = async ()=>{
        if(!fileInput.files[0]) return;
        state.scanning = date;
        render();
        try{
          const dishes = await scanMenuImage(fileInput.files[0], 'single');
          if(dishes && dishes.length){
            state.monthDraft[date] = dishes.join('\n');
          } else {
            alert('沒有辨識到菜色，請嘗試更清楚的照片，或手動輸入。');
          }
        }catch(e){
          console.error(e);
          alert('辨識失敗：' + (e && e.message ? e.message : '請確認圖片清晰後再試一次') + '。也可以直接手動輸入。');
        }
        state.scanning = null;
        render();
      };
      fileInput.click();
    };
  });

  // month scan
  const monthFileInput = body.querySelector('#monthFileInput');
  body.querySelector('#scanMonthBtn').onclick = ()=>{
    monthFileInput.value = '';
    monthFileInput.onchange = async ()=>{
      if(!monthFileInput.files[0]) return;
      state.scanning = 'month';
      render();
      try{
        const monthData = await scanMenuImage(monthFileInput.files[0], 'month');
        if(monthData && Object.keys(monthData).length){
          let filled = 0;
          Object.entries(monthData).forEach(([dayNum, dishList])=>{
            const n = parseInt(dayNum, 10);
            if(!n || !dishList || !dishList.length) return;
            const match = dates.find(d=>d.getDate()===n);
            if(match){
              state.monthDraft[fmtDate(match)] = dishList.join('\n');
              filled++;
            }
          });
          if(!filled){
            alert('圖片中沒有找到符合這個月份的日期，請確認上傳的是正確月份的菜單，或改用手動輸入。');
          }
        } else {
          alert('沒有辨識到菜色，請嘗試更清楚的照片，或改用手動輸入。');
        }
      }catch(e){
        console.error(e);
        alert('辨識失敗：' + (e && e.message ? e.message : '請確認圖片清晰後再試一次') + '。也可以直接手動輸入。');
      }
      state.scanning = null;
      render();
    };
    monthFileInput.click();
  };
}

// ---------------- AI 掃描菜單 ----------------
function fileToResizedBase64(file, maxDim){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.onerror = ()=> reject(new Error('圖片讀取失敗'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('圖片讀取失敗'));
    reader.readAsDataURL(file);
  });
}
function extractJson(text){
  const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  const jsonStr = (start!==-1 && end!==-1) ? cleaned.slice(start, end+1) : cleaned;
  return JSON.parse(jsonStr);
}
const GEMINI_API_KEY = "AQ.Ab8RN6KjWIje3-gaSV6vEzkRBUUA2b5Xa6xXo0K8_c7b9GtLpw";
async function scanMenuImage(file, mode){
  const { base64, mediaType } = await fileToResizedBase64(file, 1500);
  const prompt = mode==='single'
    ? `這是一張學校午餐菜單照片，內容是「單一天」的菜色。請只列出實際會提供的菜色名稱（不需要日期、熱量等資訊），以純 JSON 回傳，格式如下：\n{"dishes": ["菜名1", "菜名2"]}`
    : `這是一張學校午餐菜單照片，內容是「整個月」的菜色。請整理成純 JSON，key 為日期數字（1~31），value 為當天的菜色名稱陣列。範例：\n{"1": ["紅燒獅子頭", "炒高麗菜"], "3": ["宮保雞丁"]}`;

  let response;
  try {
    // 改用 v1 正式端點與標準 gemini-2.0-flash 模型名稱
response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mediaType, data: base64 } }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json"
        }
      })
    });
  } catch(networkErr) {
    throw new Error('無法連上辨識服務，請確認網路連線');
  }

  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error?.message || `辨識服務錯誤（狀態碼 ${response.status}）`);
  }

  const textBlocks = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!textBlocks) throw new Error('辨識服務沒有回傳結果');

  const parsed = extractJson(textBlocks);
  if (mode === 'single') return parsed.dishes || [];
  return parsed;
}

async function submitRatings(){
  const btn = document.getElementById('submitBtn');
  if(btn){ btn.disabled = true; btn.textContent = '送出中...'; }
  const className = `${state.grade}年${state.classNum}班`;
  const ts = Date.now();
  const today = todayStr();
  const dishes = (state.menus[state.vendor] && state.menus[state.vendor][today]) || [];

  try{
    const res = await window.storage.get('survey-data', true).catch(()=>null);
    const data = res ? JSON.parse(res.value) : { responses: [], submissions: [] };
    
    // 【功能 1】防重複填答檢查：檢查該班級今天是否已提交過
   const hasSubmittedToday = (data.submissions || []).some(s => s.date === today && s.class === className);
// 如果是後台人員使用「測試按鈕」測試填答，不阻擋重複送出
    if(hasSubmittedToday && !state.isTester){
      alert(`⚠️ ${className} 今天已經完成過午餐滿意度評比囉！\n每個班級一天只能填答一次。`);
      if(btn){ btn.disabled = false; btn.textContent = '送出評比'; }
      return;
    }

    const newResponses = dishes.map(dish => ({
      id: `${ts}-${dish}-${Math.random().toString(36).slice(2,7)}`,
      vendor: state.vendor,
      class: className,
      dish,
      rating: state.ratings[dish],
      date: today,
      ts
    }));

    // 紀錄各班提交的主紀錄，並把各菜色評分一併存入方便後台審查
    const newSubmission = {
      id: `${ts}-${Math.random().toString(36).slice(2,7)}`,
      vendor: state.vendor,
      class: className,
      date: today,
      ts,
      dishCount: dishes.length,
      details: state.ratings // 儲存該班每道菜的評分
    };

    data.responses = [...(data.responses||[]), ...newResponses];
    data.submissions = [...(data.submissions||[]), newSubmission];
    
    await window.storage.set('survey-data', JSON.stringify(data), true);
  }catch(e){
    console.error('送出失敗', e);
    alert('送出時發生問題，請檢查網路連線後再試一次。');
    if(btn){ btn.disabled = false; btn.textContent = '送出評比'; }
    return;
  }
  state.screen = 'thanks';
  render();
}
